name: nomaddesk

services:
  db:
    image: postgres:17-alpine
    container_name: nomaddesk_db
    ports:
      - "55188:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nomaddesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nomaddesk_mailpit
    ports:
      - "18188:8025"
      - "11188:1025"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      additional_contexts:
        seed: ./docs/seed
    container_name: nomaddesk_web
    ports:
      - "3288:3288"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/nomaddesk}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3288}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-nomaddesk_jwt_secret_dev}
      AUTH_SECRET: ${AUTH_SECRET:-nomaddesk_jwt_secret_dev}
      AUTH_TRUST_HOST: "true"
      ALLOW_MOCK_RESET: ${ALLOW_MOCK_RESET:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      UPLOAD_DIR: /app/web/.data/uploads
      PORT: 3288
      HOSTNAME: 0.0.0.0
    volumes:
      - ky-uploads:/app/web/.data/uploads
    command: sh -c "npm run db:migrate && npm run db:seed && exec npm start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3288/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  ky-uploads:
